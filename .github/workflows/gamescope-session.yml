name: gamescope-session
on:
  push:
    branches: [main]
    paths: ['gamescope-session/**', 'oci/**', '.github/workflows/gamescope-session.yml', '.github/workflows/_package-image.yml', 'toolchain.env', 'TERRA.env']
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and publish as a matching container tag. Leave empty to use the workflow ref."
        type: string
        default: ""
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    uses: ./.github/workflows/_package-image.yml
    secrets: inherit
    with:
      package: gamescope-session
      branch: ${{ inputs.branch || '' }}
