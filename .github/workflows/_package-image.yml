name: package-image

# Reusable: build one package, wrap its artifacts in a scratch image, push to
# ghcr.io/<owner>/armada-packages/<package>, and print the digest to pin in armada.
on:
  workflow_call:
    inputs:
      package:
        description: "Image name suffix under ghcr.io/<owner>/armada-packages/"
        required: true
        type: string
      branch:
        description: "Branch to build and publish as a matching container tag"
        required: false
        type: string
        default: ""
      runner:
        description: "Runner to build on. Cross-compiled packages can use x86_64."
        required: false
        type: string
        default: ubuntu-24.04-arm
      image_arch:
        description: "Arch to label the carrier image with when it differs from the runner"
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "The pushed image digest (pin this in armada's Containerfile)"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}   # default is native aarch64; free for public repos
    concurrency:
      group: ${{ inputs.package }}-image-${{ inputs.branch || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write           # cosign keyless (Sigstore OIDC)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/armada-packages/${{ inputs.package }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Resolve manual build ref
        id: manual
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH}"
          if [ -z "${branch}" ]; then
            exit 0
          fi
          branch="${branch#refs/heads/}"
          if ! [[ "${branch}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Branch '${branch}' cannot be used as a matching container tag. Start with a letter, number, or underscore; remaining characters may also include dots or dashes."
            exit 1
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.manual.outputs.branch || github.sha }}

      - name: Tooling
        run: |
          sudo apt-get update -y && sudo apt-get install -y podman buildah ccache runc
          # Runner-image crun mismatches podman ("crun: unknown version
          # specified"); runc is version-stable.
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
          mkdir -p "${CCACHE_DIR}"

      # Opt-in lives in each build.sh: only those that wire up ccache populate
      # this per-package dir.
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # hash the pinned toolchain into the key so a bump can't serve stale objects
          key: ccache-${{ inputs.package }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}-${{ hashFiles(format('{0}/**', inputs.package)) }}
          restore-keys: |
            ccache-${{ inputs.package }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}-

      - name: Build artifacts
        run: cd ${{ inputs.package }} && ./build.sh

      - name: Stage image context
        run: |
          bash scripts/stage.sh ${{ inputs.package }}
          echo "Staged for ${IMAGE,,}:" && find ctx -type f

      - name: Build + push
        id: push
        env:
          CHANNEL_TAG: ${{ steps.manual.outputs.branch || 'latest' }}
        run: |
          IMMUTABLE_TAG="$(date -u +%Y%m%d)-$(git rev-parse --short=8 HEAD)"
          ARCH_FLAG=()
          if [ -n "${{ inputs.image_arch }}" ]; then
            ARCH_FLAG=(--arch "${{ inputs.image_arch }}")
          fi
          buildah build "${ARCH_FLAG[@]}" -f oci/Containerfile -t "${IMAGE,,}:${IMMUTABLE_TAG}" .
          buildah tag "${IMAGE,,}:${IMMUTABLE_TAG}" "${IMAGE,,}:${CHANNEL_TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io
          buildah push "${IMAGE,,}:${IMMUTABLE_TAG}"
          buildah push --digestfile /tmp/digest "${IMAGE,,}:${CHANNEL_TAG}"
          DIGEST="$(cat /tmp/digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### \`${{ inputs.package }}\` published"
            echo "Branch/channel tag:"
            echo '```'
            echo "${IMAGE,,}:${CHANNEL_TAG}"
            echo '```'
            echo "Immutable digest pin for armada's Containerfile:"
            echo '```'
            echo "${IMAGE,,}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (cosign keyless)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${IMAGE,,}@${{ steps.push.outputs.digest }}"
