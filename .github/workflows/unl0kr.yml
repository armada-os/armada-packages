name: unl0kr
on:
  push:
    branches: ['**']
    paths: ['unl0kr/**', 'oci/**', '.github/workflows/unl0kr.yml', '.github/workflows/_package-image.yml', 'toolchain.env']
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and publish as a matching container tag. Leave empty to use the workflow ref."
        type: string
        default: ""
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    uses: ./.github/workflows/_package-image.yml
    secrets: inherit
    with:
      package: unl0kr
      branch: ${{ inputs.branch || '' }}
